[project]
name = "repopilot"
version = "0.1.0"
description = "Repository-aware issue resolution agent — hand-written, no framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "zsyayo112" }]
keywords = [
    "ai-agent", "coding-agent", "llm", "issue-resolution",
    "swe-agent", "deepseek", "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
# 浏览器验证是【可选】能力：不装照样能跑全部原有功能，只是 browser_* 工具不暴露。
# 这条边界是刻意的 —— 核心运行时依赖仍然只有 openai + python-dotenv。
browser = ["playwright>=1.40"]

[project.urls]
Homepage = "https://github.com/zsyayo112/repopilot"
Repository = "https://github.com/zsyayo112/repopilot"
Issues = "https://github.com/zsyayo112/repopilot/issues"

[project.scripts]
repo-pilot = "repopilot.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["repopilot*"]

[tool.ruff]
line-length = 100
target-version = "py310"
# 评测产物里是【别人的仓库】—— 克隆下来的被测代码、每实例的 venv、运行轨迹。
# 拿我们的 lint 规则去检查 sphinx 的源码毫无意义，只会把真正的问题淹掉。
exclude = ["eval/cache", "eval/envs", "eval/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501（行长）：双语注释天然偏长，强拆反而伤可读性，这里不作硬性要求
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
